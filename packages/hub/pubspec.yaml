name: school_link_hub
description: LAN hub server for SchoolLink (accounts, roster, messages, files, sync).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  args: ^2.7.0
  convert: ^3.1.1
  crypto: ^3.0.6
  logging: ^1.3.0
  mime: ^2.0.0
  path: ^1.9.1
  sembast: ^3.8.5
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  shelf_web_socket: ^3.0.0
  school_link_protocol:
    path: ../protocol
  web_socket_channel: ^3.0.3

dev_dependencies:
  http: ^1.4.0
  lints: ^5.1.1
  test: ^1.25.15
